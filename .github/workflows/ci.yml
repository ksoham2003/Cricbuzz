name: Cricbuzz CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  client-checks:
    name: Client Lint and Build Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci
        working-directory: client

      - name: Lint Client Code
        run: npm run lint
        working-directory: client

      - name: Build Client App
        run: npm run build
        working-directory: client

  server-checks:
    name: Server Test Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: npm ci
        working-directory: server

      - name: Run Server Unit Tests
        env:
          GOOGLE_CLIENT_ID: "dummy-id"
          GOOGLE_CLIENT_SECRET: "dummy-secret"
          GOOGLE_CALLBACK_URL: "http://localhost:8000/api/auth/google/callback"
          ACCESS_TOKEN_SECRET: "dummy-access-token-secret-for-testing-purposes"
          REFRESH_TOKEN_SECRET: "dummy-refresh-token-secret-for-testing-purposes"
          REDIRECT_URL: "http://localhost:5173"
        run: npm test
        working-directory: server
